# Test configuration for GameResourceOracleTest
# Uses same PDF resources as main application

# Logging for test execution
logging.level.fi.celssi.chatdm=DEBUG

# Suppress PDFBox warnings for malformed/encrypted PDFs during tests
# Note: Some PDFs have encryption/structural issues that don't affect text extraction
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.fontbox=OFF
