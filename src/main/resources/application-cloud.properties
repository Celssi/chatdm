# Cloud profile: GCS for PDFs, index, and journal
server.port=8080
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.protocol=SSE

# GCS bucket - set CHATDM_GCS_BUCKET or GOOGLE_CLOUD_PROJECT env
# Base path for PDFs (ResourceResolver prepends this to paths like "pdfs/lotr/...")
chatdm.pdfs.base-path=gs://${CHATDM_GCS_BUCKET:${GOOGLE_CLOUD_PROJECT}-chatdm-resources}
chatdm.search-index.path=gs://${CHATDM_GCS_BUCKET:${GOOGLE_CLOUD_PROJECT}-chatdm-resources}/search_index.db
chatdm.journal.base-path=gs://${CHATDM_GCS_BUCKET:${GOOGLE_CLOUD_PROJECT}-chatdm-resources}/journal
