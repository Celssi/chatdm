spring.application.name=ChatDM
spring.main.banner-mode=off

# Suppress PDFBox warnings for malformed/encrypted PDFs
# Note: Some PDFs have encryption/font issues that don't affect text extraction
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR

# Local defaults (classpath for PDFs, embedded index)
chatdm.pdfs.base-path=
chatdm.search-index.path=

# MCP: STDIO for local, SSE for cloud (set via spring.ai.mcp.server.protocol=SSE when cloud)
spring.ai.mcp.server.stdio=true
